<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nordstern: Heute</title>
<style>
:root{
  --bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--ac:#1f6f5c;--acbg:#dcefe9;--bd:#e3e1da;--dim:#ecebe6;--warn:#b5473c;--warnbg:#fbeae8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151615;--card:#202220;--tx:#eeede8;--mut:#a1a099;--ac:#5fc4a8;--acbg:#1d3a32;--bd:#2f322f;--dim:#2a2c2a;--warn:#e57368;--warnbg:#3b2220;color-scheme:dark
  }
}
:root[data-theme="dark"]{
  --bg:#151615;--card:#202220;--tx:#eeede8;--mut:#a1a099;--ac:#5fc4a8;--acbg:#1d3a32;--bd:#2f322f;--dim:#2a2c2a;--warn:#e57368;--warnbg:#3b2220;color-scheme:dark
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:16px 14px 48px}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
h1{font-size:26px;margin:4px 0 0}
.date{color:var(--mut);margin:0;text-transform:capitalize}
.icon-btn{padding:8px 12px;min-height:40px;font-size:14px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:0 0 12px}
.card-hdr{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px}
.card-hdr h2{margin:0}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 8px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
.dots{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);transition:background .2s,border-color .2s}
.dot.on{background:var(--ac);border-color:var(--ac)}
.big{font-size:22px;font-weight:700;margin:0 0 2px}
.sub{color:var(--mut);font-size:14px;margin:0}
button{font:inherit;color:var(--tx);background:var(--dim);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer;transition:transform .08s,background .15s}
button:active{transform:scale(.98)}
button.sel{background:var(--acbg);border-color:var(--ac);color:var(--ac);font-weight:600}
button.pri{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:700;width:100%}
button.sm{padding:6px 10px;min-height:34px;font-size:13px;border-radius:10px}
button.warn{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.blk{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--bd)}
.blk:first-of-type{border-top:0;padding-top:4px}
.blk:last-of-type{padding-bottom:4px}
.blk.off{opacity:.42}
.min{min-width:50px;font-weight:700;color:var(--ac);font-size:15px}
.blk-body{flex:1;min-width:0}
.blk b{display:block;margin-bottom:2px}
.blk span{color:var(--mut);font-size:15px;display:block}
.last-note{background:var(--dim);border-left:3px solid var(--ac);border-radius:8px;padding:7px 10px;margin-top:8px;font-size:14px;color:var(--tx)}
.last-note small{color:var(--mut);display:block;font-size:12px;margin-bottom:2px}
.fmt{background:var(--acbg);border-radius:12px;padding:10px 12px;margin-top:8px;color:var(--tx)}
.fmt b{color:var(--ac);margin-bottom:4px}
.fmt small{display:block;color:var(--mut);margin-top:4px;font-size:13px}
.feel button{flex:1;padding:10px 0}
input[type="text"],textarea{font:inherit;width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:8px 0}
textarea{min-height:74px;resize:vertical;line-height:1.4}
.log{font-size:15px;padding:8px 0;border-top:1px solid var(--bd);display:flex;justify-content:space-between;gap:10px}
.log:first-of-type{border-top:0}
.log small{color:var(--mut)}
.link{background:none;border:0;color:var(--mut);padding:6px 0;min-height:36px;text-decoration:underline;font-size:14px}

/* Timer UI */
.timer-box{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.timer-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.timer-clock{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ac);line-height:1.1}
.timer-badge{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:4px 8px;border-radius:8px;background:var(--acbg);color:var(--ac)}
.timer-badge.rest{background:var(--dim);color:var(--mut)}
.timer-sub{font-size:13px;color:var(--mut);margin:2px 0 10px}
.timer-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.timer-ctrl{display:flex;gap:8px;align-items:center}
.timer-ctrl button{flex:1}

/* Stats Grid */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat-box{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.stat-val{font-size:20px;font-weight:700;color:var(--ac);display:block}
.stat-lbl{font-size:12px;color:var(--mut)}
.bar-wrap{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--dim);gap:2px}
.bar-seg{height:100%;transition:width .3s}

/* Toast Banner */
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* Editor / Modal Details */
.ed-sec{border-top:1px solid var(--bd);padding-top:10px;margin-top:10px}
.ed-sec:first-of-type{border-top:0;padding-top:0;margin-top:0}
.ed-lbl{font-size:13px;font-weight:600;color:var(--mut);display:block;margin-top:6px}
.hidden{display:none!important}
</style>
</head>
<body>
<main>
  <!-- Kopfzeile mit Datum und Theme-Toggle -->
  <div class="hdr">
    <div>
      <h1>Heute</h1>
      <p class="date" id="date"></p>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Farbschema wechseln">Auto</button>
  </div>

  <!-- Wochenfortschritt & Streak -->
  <div class="card">
    <div class="card-hdr">
      <h2>Diese Woche</h2>
      <span class="sub" id="streakBadge"></span>
    </div>
    <div class="dots" id="dots"></div>
    <p class="sub" id="wk" style="margin-top:8px"></p>
  </div>

  <!-- Trainingsauswahl -->
  <div class="card">
    <h2>Dran ist</h2>
    <p class="big" id="next"></p>
    <p class="sub" id="nextsub"></p>
    <div class="row" id="types" style="margin-top:10px"></div>
  </div>

  <!-- Zeitfenster -->
  <div class="card">
    <h2>Wie viel Zeit?</h2>
    <div class="seg" id="sizes"></div>
  </div>

  <!-- Integrierter Workout-Timer -->
  <div class="card">
    <div class="card-hdr">
      <h2>Workout-Timer</h2>
      <button class="sm" id="soundBtn">Ton: An</button>
    </div>
    <div class="timer-presets" id="timerPresets"></div>
    <div class="timer-box">
      <div class="timer-top">
        <div class="timer-clock" id="tClock">00:45</div>
        <span class="timer-badge" id="tBadge">Bereit</span>
      </div>
      <div class="timer-sub" id="tInfo">45 Sek. Countdown (z. B. tiefe Hocke / Holds)</div>
      <div class="timer-ctrl">
        <button class="sel" id="tStart">Start</button>
        <button id="tReset">Reset</button>
        <button id="tLap" class="hidden">+ Runde (0)</button>
      </div>
    </div>
  </div>

  <!-- Trainingsablauf + Kontext-Notiz + Editor-Toggle -->
  <div class="card">
    <div class="card-hdr">
      <h2>Ablauf</h2>
      <button class="sm" id="editToggleBtn">Plan anpassen</button>
    </div>
    <div id="plan"></div>
    <!-- Inline Editor für Übungen und Formate -->
    <div id="editorArea" class="hidden" style="margin-top:12px;border-top:1px solid var(--bd);padding-top:12px"></div>
  </div>

  <!-- Abschluss & Logbuch -->
  <div class="card">
    <h2>Abschluss und Logbuch</h2>
    <p class="sub" style="margin-bottom:6px">Wie hat es sich angefühlt? (1 = zäh, 5 = stark)</p>
    <div class="row feel" id="feel"></div>
    <input id="note" type="text" placeholder="Skill-Stand, Gewicht, Runden oder Zeit (optional)" maxlength="140">
    <button class="pri" id="done">Einheit abhaken</button>
  </div>

  <!-- Bonus-Einheiten -->
  <div class="card">
    <h2>Bonus (zählt nicht fürs Wochenziel)</h2>
    <div class="row" id="bonus"></div>
  </div>

  <!-- Statistik & Verteilung -->
  <div class="card">
    <h2>Statistik &amp; Balance</h2>
    <div class="stats-grid" id="statsGrid"></div>
    <div class="bar-wrap" id="distBar"></div>
    <p class="sub" id="distText" style="margin-top:6px;font-size:13px"></p>
  </div>

  <!-- Verlauf & Daten-Backup -->
  <div class="card">
    <h2>Verlauf &amp; Backup</h2>
    <div id="hist"></div>
    <div class="row" style="margin-top:10px;justify-content:space-between;align-items:center">
      <button class="link" id="undo">Letzten Eintrag löschen</button>
      <div class="row">
        <button class="sm" id="exportBtn">Export</button>
        <button class="sm" id="importBtn">Import</button>
        <input type="file" id="importFile" accept=".json,application/json" class="hidden">
      </div>
    </div>
    <div id="confirmRow" class="hidden" style="margin-top:10px;padding:10px;border-radius:12px;background:var(--warnbg);border:1px solid var(--warn)">
      <p class="sub" style="color:var(--warn);margin-bottom:8px;font-weight:600" id="confirmMsg">Wirklich löschen?</p>
      <div class="row">
        <button class="sm warn" id="confirmYes">Ja, ausführen</button>
        <button class="sm" id="confirmNo">Abbrechen</button>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  var KEY = "nordstern-v2";
  var OLD_KEY = "nordstern-v1";
  var TYPES = {uk:"Unterkörper-Skill", ok:"Oberkörper-Skill", gk:"Ganzkörper-Spiel"};
  var ORDER = ["uk","ok","gk"];
  var BONUS = {flow:"Flow und Mobilität", trail:"Trail draußen", out:"Draußen und frei"};

  /* Standard-Trainingsdaten (können im Editor angepasst werden) */
  var DEFAULT_DATA = {
    uk:{
      ritual:"90/90 Hip Switches 1 × 8, Hüft- und Knie-CARs je 3 langsame Rotationen, tiefe Hocke 45 Sek.",
      skill:"Pistol Squat mit Gegengewicht: 3 Sek. absenken, 5 Sek. unten halten, 3–5 Wdh. pro Bein. Zum Schluss 1 Satz Sissy Squats mit Hilfe.",
      end:"Hüftbeuger-Stretch 60 Sek. pro Seite, 90/90-Lagerung 2 Min."
    },
    ok:{
      ritual:"Katze-Kuh und Schulter-CARs 5–8, Band Pull-Aparts 1 × 15, Scapular Pull-ups 1 × 6–8.",
      skill:"Pike Push-ups (Füße am Boden) 3–5 Wdh. pro Runde, Wand-Handstand 3 × 15–20 Sek., negative Handstand-Liegestütze 3 × 2 mit 3 Sek. Absenken. Mit Zeit: Klimmzüge 2 × 3–4 oder Tuck Front Lever Hold 3 × 8–10 Sek.",
      end:"Thread the Needle und Chin Tucks."
    },
    gk:{
      ritual:"Ober- oder Unterkörper-Ritual, je nachdem, was sich besser anfühlt.",
      skill:"Pistol oder Handstand, nach Lust.",
      end:"Stretch nach Gefühl."
    }
  };

  var DEFAULT_F = [
    ["EMOM","10 Min., drei Stationen im Kreis, Minute 10 frei",
      {ok:"Min. 1: 4 Klimmzüge. Min. 2: 5 Dips mit gelbem Band. Min. 3: 8 Pallof Press pro Seite.",
       uk:"Min. 1: 5 Bulgarian Split Squats pro Bein. Min. 2: 6 Reverse Nordic Curls. Min. 3: 8 Pallof Press pro Seite.",
       gk:"Min. 1: 4 Klimmzüge. Min. 2: 5 Bulgarian Split Squats pro Bein. Min. 3: 6 Body Saw."}],
    ["AMRAP","Runden zählen",
      {ok:"3 Klimmzüge, 5 Dips mit gelbem Band, 6 Ring-Rudern, Long Lever Plank 20 Sek.",
       uk:"5 Bulgarian Split Squats pro Bein, 6 Reverse Nordic Curls, 10 einbeinige Wadenheben, 8 Pallof Press pro Seite.",
       gk:"3 Klimmzüge, 5 Bulgarian Split Squats pro Bein, 5 Pike Push-ups, 6 Ring-Fallouts."}],
    ["Flow","Kette ohne Pause, dann von vorn",
      {ok:"6 Ring-Rudern, Dip-Position 5 Sek., 5 Ring-Liegestütze, Tuck Front Lever Hold 8 Sek., Dead Hang 15 Sek.",
       uk:"Tiefe Hocke 10 Sek., 4 Skater Squats pro Bein, 8 Single-Leg RDLs pro Bein mit Band, kleiner Sprung, Seitstütz 15 Sek. pro Seite.",
       gk:"6 Ring-Rudern, Dip-Position 5 Sek., tiefe Hocke 10 Sek., kleiner Sprung, Dead Hang 15 Sek., Seitstütz 15 Sek. pro Seite."}],
    ["Schlingen-und-Ringe-Tabata","20 Sek. Arbeit, 10 Sek. Pause, 2 Durchgänge à 8 Runden",
      {ok:"Durchgang 1: Ring-Rudern und Ring-Liegestütze. Durchgang 2: Pike Push-ups und Body Saw.",
       uk:"Durchgang 1: Ring Hamstring Curls und Skater Squats. Durchgang 2: einbeinige Wadenheben und Pallof Hold.",
       gk:"Durchgang 1: Ring-Rudern und Ring Hamstring Curls. Durchgang 2: Pike Push-ups und Body Saw."}],
    ["Rückenfreundlicher Core-Flow","Runden zählen",
      {ok:"6 Ring-Fallouts, Tuck Front Lever Hold 8 Sek., 8 Pallof Press pro Seite, Seitstütz 20 Sek. pro Seite.",
       uk:"8 Dead Bugs pro Seite, 6 Long Lever Bridge, 8 Pallof Press pro Seite, Seitstütz 20 Sek. pro Seite.",
       gk:"6 Body Saw, 8 Band-Chops pro Seite, Long Lever Plank 25 Sek., 6 Long Lever Bridge."}],
    ["Sprossenwand-Parcours","Kurze Pause zwischen den Durchgängen, beste Zeit notieren",
      {ok:"Seitlich hängend traversieren, 3 Klimmzüge, Dip-Position 5 Sek., Dead Hang 15 Sek.",
       uk:"Sprossenwand hochsteigen, abspringen, tiefe Hocke 10 Sek., 4 Skater Squats pro Bein, Seitstütz 15 Sek. pro Seite.",
       gk:"Seitlich traversieren, hochziehen, abspringen, tiefe Hocke 10 Sek., Seitstütz 15 Sek. pro Seite."}]
  ];

  function clone(obj){ return JSON.parse(JSON.stringify(obj)); }

  /* State laden + automatische Migration von nordstern-v1 */
  var st = {
    log: [],
    theme: "auto",
    sound: true,
    customData: null,
    customF: null
  };

  try {
    var raw = localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && Array.isArray(p.log)) st.log = p.log;
      if (p && (p.theme === "light" || p.theme === "dark" || p.theme === "auto")) st.theme = p.theme;
      if (p && typeof p.sound === "boolean") st.sound = p.sound;
      if (p && p.customData) st.customData = p.customData;
      if (p && Array.isArray(p.customF)) st.customF = p.customF;
    }
  } catch (e) {}

  function getData(){ return st.customData || DEFAULT_DATA; }
  function getF(){ return st.customF || DEFAULT_F; }

  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
  }

  /* Hilfsfunktionen */
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function btn(label, cls, fn){
    var b = document.createElement("button");
    b.textContent = label;
    if (cls) b.className = cls;
    b.onclick = fn;
    return b;
  }

  var toastTimer = null;
  function toast(msg){
    var el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2600);
  }

  /* Theme-Steuerung */
  function applyTheme(){
    var root = document.documentElement;
    if (st.theme === "auto") {
      root.removeAttribute("data-theme");
      $("themeBtn").textContent = "Theme: Auto";
    } else if (st.theme === "dark") {
      root.setAttribute("data-theme", "dark");
      $("themeBtn").textContent = "Theme: Dunkel";
    } else {
      root.setAttribute("data-theme", "light");
      $("themeBtn").textContent = "Theme: Hell";
    }
  }
  $("themeBtn").onclick = function(){
    var order = ["auto", "dark", "light"];
    st.theme = order[(order.indexOf(st.theme) + 1) % 3];
    save();
    applyTheme();
  };

  /* Datums- und Statistik-Helfer */
  function dk(d){
    var m = d.getMonth() + 1, x = d.getDate();
    return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (x < 10 ? "0" : "") + x;
  }
  function weekStartFromDate(d){
    var copy = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12, 0, 0);
    var w = (copy.getDay() + 6) % 7;
    copy.setDate(copy.getDate() - w);
    return dk(copy);
  }
  function weekStart(){ return weekStartFromDate(new Date()); }
  function core(){ return st.log.filter(function(e){ return ORDER.indexOf(e.t) > -1; }); }
  function nextType(){
    var c = core();
    if (!c.length) return "uk";
    var i = ORDER.indexOf(c[c.length - 1].t);
    return ORDER[(i + 1) % 3];
  }

  /* Berechnet Wochen-Streak (aufeinanderfolgende Wochen mit >= 3 Kerneinheiten) */
  function calcWeekStreak(){
    var c = core();
    if (!c.length) return 0;
    var counts = {};
    c.forEach(function(e){
      var ws = weekStartFromDate(new Date(e.d + "T12:00:00"));
      counts[ws] = (counts[ws] || 0) + 1;
    });
    var streak = 0;
    var curW = new Date();
    var curKey = weekStartFromDate(curW);
    if ((counts[curKey] || 0) >= 3) streak++;
    while (true) {
      curW.setDate(curW.getDate() - 7);
      var k = weekStartFromDate(curW);
      if ((counts[k] || 0) >= 3) streak++;
      else break;
    }
    return streak;
  }

  /* Web Audio Synthesizer für Timer-Signale (keine externen MP3s nötig) */
  var audioCtx = null;
  function beep(freq, dur, type, delay){
    if (!st.sound) return;
    try {
      if (!audioCtx) {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (!audioCtx) return;
      if (audioCtx.state === "suspended") audioCtx.resume();
      var start = audioCtx.currentTime + (delay || 0);
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.18, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + dur);
    } catch (e) {}
  }

  /* =========================================================
     TIMER ENGINE
     Modi:
     - "hold45": 45 Sek. Countdown (z.B. tiefe Hocke / Stretch)
     - "emom":   10 Min. (oder 5 Min. bei 20-Min-Session) Minuten-Gong
     - "tabata": 20s Arbeit / 10s Pause (8 Runden pro Block)
     - "amrap":  Countdown (10 Min. oder 5 Min.) + Rundenzähler
     - "up":     Stoppuhr aufwärts (z.B. Sprossenwand-Parcours)
     ========================================================= */
  var timer = {
    mode: "hold45",
    running: false,
    interval: null,
    sec: 45,
    total: 45,
    laps: 0,
    phase: "work", // work | rest
    round: 1,
    maxRounds: 8
  };

  function formatTime(s){
    var m = Math.floor(s / 60);
    var r = s % 60;
    return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r;
  }

  function setTimerMode(mode){
    stopTimer();
    timer.mode = mode;
    timer.laps = 0;
    timer.round = 1;
    timer.phase = "work";
    var half = (size === 20);
    if (mode === "hold45") {
      timer.total = 45;
      timer.sec = 45;
    } else if (mode === "emom") {
      timer.total = half ? 300 : 600;
      timer.sec = timer.total;
    } else if (mode === "amrap") {
      timer.total = half ? 300 : 600;
      timer.sec = timer.total;
    } else if (mode === "tabata") {
      timer.maxRounds = half ? 4 : 8;
      timer.sec = 20;
    } else if (mode === "up") {
      timer.sec = 0;
    }
    renderTimer();
  }

  function stopTimer(){
    timer.running = false;
    if (timer.interval) {
      clearInterval(timer.interval);
      timer.interval = null;
    }
  }

  function tickTimer(){
    if (timer.mode === "up") {
      timer.sec++;
      renderTimer();
      return;
    }

    if (timer.mode === "tabata") {
      if (timer.sec > 1) {
        timer.sec--;
        if (timer.sec <= 3) beep(440, 0.08, "sine", 0);
      } else {
        if (timer.phase === "work") {
          if (timer.round >= timer.maxRounds) {
            stopTimer();
            timer.sec = 0;
            beep(880, 0.25, "triangle", 0);
            beep(1100, 0.35, "triangle", 0.28);
            toast("Tabata Durchgang fertig!");
          } else {
            timer.phase = "rest";
            timer.sec = 10;
            beep(330, 0.25, "sine", 0);
          }
        } else {
          timer.round++;
          timer.phase = "work";
          timer.sec = 20;
          beep(660, 0.2, "triangle", 0);
          beep(880, 0.2, "triangle", 0.18);
        }
      }
      renderTimer();
      return;
    }

    /* Countdown-Modi: hold45, emom, amrap */
    if (timer.sec > 1) {
      timer.sec--;
      if (timer.mode === "emom") {
        var elapsed = timer.total - timer.sec;
        var remInMin = 60 - (elapsed % 60);
        if (remInMin <= 3 && remInMin > 0) beep(440, 0.07, "sine", 0);
        if (elapsed > 0 && elapsed % 60 === 0) {
          beep(784, 0.18, "triangle", 0);
          beep(1046, 0.25, "triangle", 0.18);
        }
      } else if (timer.sec <= 3) {
        beep(440, 0.08, "sine", 0);
      }
    } else {
      timer.sec = 0;
      stopTimer();
      beep(880, 0.25, "triangle", 0);
      beep(1100, 0.35, "triangle", 0.28);
      toast("Zeit abgelaufen!");
    }
    renderTimer();
  }

  function renderTimer(){
    var presets = [
      {id:"hold45", label:"45s Hold"},
      {id:"emom",   label:(size===20?"5m":"10m")+" EMOM"},
      {id:"tabata", label:"Tabata 20/10"},
      {id:"amrap",  label:(size===20?"5m":"10m")+" AMRAP"},
      {id:"up",     label:"Stoppuhr"}
    ];
    var pWrap = $("timerPresets");
    pWrap.innerHTML = "";
    presets.forEach(function(pr){
      pWrap.appendChild(btn(pr.label, "sm" + (timer.mode === pr.id ? " sel" : ""), function(){
        setTimerMode(pr.id);
      }));
    });

    $("tClock").textContent = formatTime(timer.sec);
    var badge = $("tBadge");
    var info = $("tInfo");
    var lapBtn = $("tLap");

    badge.className = "timer-badge";
    lapBtn.classList.add("hidden");

    if (timer.mode === "hold45") {
      badge.textContent = timer.running ? "Läuft" : "Countdown";
      info.textContent = "45 Sek. für tiefe Hocke, Stretches oder Isometrics";
    } else if (timer.mode === "emom") {
      var totalMins = Math.round(timer.total / 60);
      var elapsed = timer.total - timer.sec;
      var curMin = Math.min(totalMins, Math.floor(elapsed / 60) + 1);
      var station = ((curMin - 1) % 3) + 1;
      badge.textContent = "Min. " + curMin + "/" + totalMins;
      info.textContent = (curMin === 10)
        ? "Minute 10: Frei / Durchatmen!"
        : "Station " + station + " (Signalton zu jeder vollen Minute)";
    } else if (timer.mode === "tabata") {
      badge.textContent = (timer.phase === "work" ? "Arbeit" : "Pause") + " · R" + timer.round + "/" + timer.maxRounds;
      if (timer.phase === "rest") badge.classList.add("rest");
      info.textContent = timer.phase === "work" ? "20 Sek. sauber arbeiten" : "10 Sek. lockern & wechseln";
    } else if (timer.mode === "amrap") {
      badge.textContent = "AMRAP";
      info.textContent = "So viele Runden wie möglich – tippe unten auf + Runde";
      lapBtn.classList.remove("hidden");
      lapBtn.textContent = "+ Runde (" + timer.laps + ")";
    } else if (timer.mode === "up") {
      badge.textContent = "Stoppuhr";
      info.textContent = "Für Parcours-Bestzeit oder freie Pausen";
      lapBtn.classList.remove("hidden");
      lapBtn.textContent = "Runde (" + timer.laps + ")";
    }

    $("tStart").textContent = timer.running ? "Pause" : "Start";
    $("soundBtn").textContent = "Ton: " + (st.sound ? "An" : "Aus");
  }

  $("tStart").onclick = function(){
    if (timer.running) {
      stopTimer();
    } else {
      if (timer.sec === 0 && timer.mode !== "up") setTimerMode(timer.mode);
      beep(660, 0.12, "triangle", 0);
      timer.running = true;
      timer.interval = setInterval(tickTimer, 1000);
    }
    renderTimer();
  };
  $("tReset").onclick = function(){ setTimerMode(timer.mode); };
  $("tLap").onclick = function(){
    timer.laps++;
    beep(880, 0.08, "sine", 0);
    renderTimer();
  };
  $("soundBtn").onclick = function(){
    st.sound = !st.sound;
    save();
    if (st.sound) beep(660, 0.1, "sine", 0);
    renderTimer();
  };

  /* Hauptzustand der Ansicht */
  var cur = nextType();
  var size = 30;
  var feel = 0;
  var fmt = null;
  var editing = false;

  /* Sucht letzten Logbuch-Eintrag für den aktuellen Typ (für Skill-Fortschritt) */
  function lastEntryForType(typeKey){
    for (var i = st.log.length - 1; i >= 0; i--) {
      if (st.log[i].t === typeKey) return st.log[i];
    }
    return null;
  }

  function blk(min, title, text, off, extra){
    return '<div class="blk' + (off ? ' off' : '') + '">' +
      '<div class="min">' + min + '</div>' +
      '<div class="blk-body"><b>' + title + '</b><span>' + text + '</span>' + (extra || "") + '</div>' +
    '</div>';
  }

  function plan(){
    var DATA = getData();
    var F = getF();
    var d = DATA[cur];
    var h = "";

    h += blk("5 Min.", "Ritual", esc(d.ritual));

    /* Letzte Notiz genau zu diesem Typ anzeigen */
    var last = lastEntryForType(cur);
    var lastHtml = "";
    if (last && (last.n || last.g)) {
      var dtStr = new Date(last.d + "T12:00:00").toLocaleDateString("de-DE", {day:"numeric", month:"numeric"});
      var infoParts = [];
      if (last.n) infoParts.push(esc(last.n));
      if (last.g) infoParts.push("Gefühl " + last.g + "/5");
      lastHtml = '<div class="last-note"><small>Zuletzt am ' + dtStr + ':</small>' + infoParts.join(" · ") + '</div>';
    }

    h += blk(
      size === 10 ? "5 Min." : "10 Min.",
      "Skill",
      esc(d.skill) + (size === 10 ? " (nur 5 Min.: ein Fokus)" : ""),
      false,
      lastHtml
    );

    var sp = size >= 20;
    var half = size === 20;
    var extra = "";
    if (sp) {
      extra = '<div class="fmt">' +
        (fmt !== null
          ? '<b>Format ' + (fmt + 1) + ': ' + esc(F[fmt][0]) + '</b>' + esc(F[fmt][2][cur]) + '<small>' + esc(F[fmt][1]) + (half ? ' · nur die ersten 5 Min.' : '') + '</small>'
          : 'Noch kein Format gewürfelt.') +
        '</div>' +
        '<div class="row" style="margin-top:8px"><button id="roll">' + (fmt === null ? 'Würfeln' : 'Neu würfeln') + '</button></div>';
    }

    h += blk(
      sp ? (half ? "5 Min." : "10 Min.") : "–",
      "Spiel",
      sp ? "Format per Würfel, Runden oder Zeit als Rekord." : "entfällt in dieser Größe",
      !sp,
      extra
    );

    h += blk(
      size === 30 ? "5 Min." : "–",
      "Abschluss",
      size === 30 ? esc(d.end) : "kurz auslaufen lassen, dann Logbuch (1 Min.)",
      size !== 30
    );

    $("plan").innerHTML = h;

    var r = $("roll");
    if (r) {
      r.onclick = function(){
        var x;
        do { x = Math.floor(Math.random() * F.length); } while (x === fmt && F.length > 1);
        fmt = x;
        /* Timer automatisch passend zum gewürfelten Format voreinstellen */
        var fName = F[fmt][0].toLowerCase();
        if (fName.indexOf("emom") > -1) setTimerMode("emom");
        else if (fName.indexOf("tabata") > -1) setTimerMode("tabata");
        else if (fName.indexOf("parcours") > -1) setTimerMode("up");
        else setTimerMode("amrap");
        plan();
      };
    }
  }

  /* In-App Editor für Übungen & Formate */
  function renderEditor(){
    var area = $("editorArea");
    if (!editing) {
      area.classList.add("hidden");
      $("editToggleBtn").textContent = "Plan anpassen";
      return;
    }
    area.classList.remove("hidden");
    $("editToggleBtn").textContent = "Editor schließen";

    var DATA = getData();
    var F = getF();
    var html = '<div class="ed-sec"><b>Texte für ' + esc(TYPES[cur]) + '</b>' +
      '<label class="ed-lbl">Ritual (5 Min.)</label><textarea id="edRitual">' + esc(DATA[cur].ritual) + '</textarea>' +
      '<label class="ed-lbl">Skill</label><textarea id="edSkill">' + esc(DATA[cur].skill) + '</textarea>' +
      '<label class="ed-lbl">Abschluss</label><textarea id="edEnd">' + esc(DATA[cur].end) + '</textarea></div>';

    if (fmt !== null) {
      html += '<div class="ed-sec"><b>Format ' + (fmt + 1) + ': ' + esc(F[fmt][0]) + ' (' + esc(TYPES[cur]) + ')</b>' +
        '<label class="ed-lbl">Regel / Beschreibung</label><input type="text" id="edFmtRule" value="' + esc(F[fmt][1]) + '">' +
        '<label class="ed-lbl">Übungen für diesen Typ</label><textarea id="edFmtText">' + esc(F[fmt][2][cur]) + '</textarea></div>';
    }

    html += '<div class="row" style="margin-top:10px">' +
      '<button class="sm sel" id="edSave">Änderungen speichern</button>' +
      '<button class="sm" id="edReset">Standard wiederherstellen</button>' +
    '</div>';

    area.innerHTML = html;

    $("edSave").onclick = function(){
      var nextData = clone(getData());
      nextData[cur].ritual = $("edRitual").value.trim() || DEFAULT_DATA[cur].ritual;
      nextData[cur].skill = $("edSkill").value.trim() || DEFAULT_DATA[cur].skill;
      nextData[cur].end = $("edEnd").value.trim() || DEFAULT_DATA[cur].end;
      st.customData = nextData;

      if (fmt !== null && $("edFmtText")) {
        var nextF = clone(getF());
        nextF[fmt][1] = $("edFmtRule").value.trim() || DEFAULT_F[fmt][1];
        nextF[fmt][2][cur] = $("edFmtText").value.trim() || DEFAULT_F[fmt][2][cur];
        st.customF = nextF;
      }
      save();
      editing = false;
      toast("Trainingsplan gespeichert");
      draw();
    };

    $("edReset").onclick = function(){
      st.customData = null;
      st.customF = null;
      save();
      editing = false;
      toast("Standard-Plan wiederhergestellt");
      draw();
    };
  }

  $("editToggleBtn").onclick = function(){
    editing = !editing;
    renderEditor();
  };

  /* Statistik & Verteilung */
  function renderStats(){
    var c = core();
    var totalCore = c.length;
    var totalMins = st.log.reduce(function(acc, e){ return acc + (e.s || 0); }, 0);
    var rated = st.log.filter(function(e){ return e.g > 0; });
    var avgFeel = rated.length
      ? (rated.reduce(function(acc, e){ return acc + e.g; }, 0) / rated.length).toFixed(1).replace(".", ",")
      : "–";

    $("statsGrid").innerHTML =
      '<div class="stat-box"><span class="stat-val">' + totalCore + '</span><span class="stat-lbl">Kerneinheiten</span></div>' +
      '<div class="stat-box"><span class="stat-val">' + totalMins + '</span><span class="stat-lbl">Minuten gesamt</span></div>' +
      '<div class="stat-box"><span class="stat-val">' + avgFeel + '</span><span class="stat-lbl">Ø Gefühl</span></div>';

    var counts = {uk:0, ok:0, gk:0};
    c.forEach(function(e){ if (counts[e.t] !== undefined) counts[e.t]++; });

    var bar = $("distBar");
    bar.innerHTML = "";
    if (!totalCore) {
      $("distText").textContent = "Noch keine Kerneinheiten für die Verteilung vorhanden.";
      return;
    }

    var colors = {uk:"#1f6f5c", ok:"#4a90e2", gk:"#d9822b"};
    ORDER.forEach(function(k){
      var pct = Math.round((counts[k] / totalCore) * 100);
      if (pct > 0) {
        var seg = document.createElement("div");
        seg.className = "bar-seg";
        seg.style.width = pct + "%";
        seg.style.background = colors[k];
        bar.appendChild(seg);
      }
    });

    $("distText").textContent =
      "UK: " + counts.uk + " · OK: " + counts.ok + " · GK: " + counts.gk +
      (st.log.length > totalCore ? " (+ " + (st.log.length - totalCore) + " Bonus)" : "");
  }

  function bonus(){
    var b = $("bonus");
    b.innerHTML = "";
    Object.keys(BONUS).forEach(function(k){
      b.appendChild(btn(BONUS[k] + " ✓", "", function(){ add(k); }));
    });
  }

  function add(t){
    st.log.push({
      d: dk(new Date()),
      t: t,
      s: t === cur ? size : 0,
      g: feel,
      n: $("note").value.trim().slice(0, 140)
    });
    if (st.log.length > 500) st.log = st.log.slice(-500);
    save();
    feel = 0;
    fmt = null;
    $("note").value = "";
    cur = nextType();
    toast("Einheit gespeichert ✓");
    draw();
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function hist(){
    var h = $("hist");
    h.innerHTML = "";
    var l = st.log.slice(-10).reverse();
    if (!l.length) {
      h.innerHTML = '<p class="sub">Noch keine Einträge.</p>';
      return;
    }
    l.forEach(function(e){
      var dt = new Date(e.d + "T12:00:00").toLocaleDateString("de-DE", {weekday:"short", day:"numeric", month:"numeric"});
      var name = TYPES[e.t] || BONUS[e.t] || e.t;
      var meta = (e.s ? e.s + " Min." : "") + (e.g ? (e.s ? " · " : "") + "Gefühl " + e.g + "/5" : "");
      var div = document.createElement("div");
      div.className = "log";
      var a = document.createElement("div");
      var b = document.createElement("b");
      b.textContent = name;
      a.appendChild(b);
      if (e.n) {
        a.appendChild(document.createElement("br"));
        var s = document.createElement("small");
        s.textContent = e.n;
        a.appendChild(s);
      }
      var c = document.createElement("small");
      c.style.textAlign = "right";
      c.textContent = dt + (meta ? "\n" + meta : "");
      c.style.whiteSpace = "pre-line";
      div.appendChild(a);
      div.appendChild(c);
      h.appendChild(div);
    });
  }

  function draw(){
    $("date").textContent = new Date().toLocaleDateString("de-DE", {weekday:"long", day:"numeric", month:"long"});
    var ws = weekStart();
    var n = core().filter(function(e){ return e.d >= ws; }).length;
    var dots = $("dots");
    dots.innerHTML = "";
    for (var i = 0; i < Math.max(3, n); i++) {
      var s = document.createElement("div");
      s.className = "dot" + (i < n ? " on" : "");
      dots.appendChild(s);
    }
    $("wk").textContent = n >= 3
      ? "Wochenziel erreicht (" + n + " Kerneinheiten). Alles weitere ist Bonus."
      : n + " von 3 Kerneinheiten";

    var streak = calcWeekStreak();
    $("streakBadge").textContent = streak > 0 ? (streak + (streak === 1 ? " Woche Serie" : " Wochen Serie")) : "";

    $("next").textContent = TYPES[cur];
    $("nextsub").textContent = cur === nextType() ? "Nächste in der Rotation" : "Von dir gewählt";

    var t = $("types");
    t.innerHTML = "";
    ORDER.forEach(function(k){
      t.appendChild(btn(TYPES[k], k === cur ? "sel" : "", function(){
        cur = k;
        fmt = null;
        draw();
      }));
    });

    var sz = $("sizes");
    sz.innerHTML = "";
    [10, 15, 20, 30].forEach(function(m){
      sz.appendChild(btn(m + " Min.", m === size ? "sel" : "", function(){
        size = m;
        if (timer.mode === "emom" || timer.mode === "amrap" || timer.mode === "tabata") {
          setTimerMode(timer.mode);
        }
        draw();
      }));
    });

    plan();
    renderEditor();

    var fe = $("feel");
    fe.innerHTML = "";
    for (var f = 1; f <= 5; f++) {
      (function(f){
        fe.appendChild(btn(String(f), f === feel ? "sel" : "", function(){
          feel = (feel === f) ? 0 : f;
          draw();
        }));
      })(f);
    }

    bonus();
    renderStats();
    hist();
  }

  /* Abschluss, Undo & JSON-Backup */
  $("done").onclick = function(){ add(cur); };

  var pendingAction = null;
  function askConfirm(msg, fn){
    pendingAction = fn;
    $("confirmMsg").textContent = msg;
    $("confirmRow").classList.remove("hidden");
  }
  $("confirmNo").onclick = function(){
    pendingAction = null;
    $("confirmRow").classList.add("hidden");
  };
  $("confirmYes").onclick = function(){
    $("confirmRow").classList.add("hidden");
    if (pendingAction) pendingAction();
    pendingAction = null;
  };

  $("undo").onclick = function(){
    if (!st.log.length) return;
    var last = st.log[st.log.length - 1];
    var label = TYPES[last.t] || BONUS[last.t] || last.t;
    askConfirm("Letzten Eintrag („" + label + "“) wirklich löschen?", function(){
      st.log.pop();
      save();
      cur = nextType();
      toast("Eintrag gelöscht");
      draw();
    });
  };

  $("exportBtn").onclick = function(){
    var blob = new Blob([JSON.stringify(st, null, 2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "nordstern-backup-" + dk(new Date()) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast("Backup heruntergeladen");
  };

  $("importBtn").onclick = function(){ $("importFile").click(); };
  $("importFile").onchange = function(ev){
    var file = ev.target.files && ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      try {
        var parsed = JSON.parse(e.target.result);
        if (!parsed || !Array.isArray(parsed.log)) throw new Error("Ungültiges Format");
        st.log = parsed.log;
        if (parsed.customData) st.customData = parsed.customData;
        if (parsed.customF) st.customF = parsed.customF;
        if (parsed.theme) st.theme = parsed.theme;
        save();
        applyTheme();
        cur = nextType();
        draw();
        toast("Backup erfolgreich importiert (" + st.log.length + " Einträge)");
      } catch (err) {
        toast("Fehler: Ungültige Backup-Datei");
      }
      ev.target.value = "";
    };
    reader.readAsText(file);
  };

  /* Initialisierung */
  applyTheme();
  renderTimer();
  draw();
})();
</script>
</body>
</html>
