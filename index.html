<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nordstern: Heute</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--ac:#1f6f5c;--acbg:#dcefe9;--bd:#e3e1da;--dim:#ecebe6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151615;--card:#202220;--tx:#eeede8;--mut:#a1a099;--ac:#5fc4a8;--acbg:#1d3a32;--bd:#2f322f;--dim:#2a2c2a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151615;--card:#202220;--tx:#eeede8;--mut:#a1a099;--ac:#5fc4a8;--acbg:#1d3a32;--bd:#2f322f;--dim:#2a2c2a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:26px;margin:4px 0 0}
.date{color:var(--mut);margin:0 0 14px;text-transform:capitalize}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:0 0 12px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 8px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
.dots{display:flex;gap:8px;align-items:center}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd)}
.dot.on{background:var(--ac);border-color:var(--ac)}
.big{font-size:22px;font-weight:700;margin:0 0 2px}
.sub{color:var(--mut);font-size:14px;margin:0}
button{font:inherit;color:var(--tx);background:var(--dim);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer}
button.sel{background:var(--acbg);border-color:var(--ac);color:var(--ac);font-weight:600}
button.pri{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:700;width:100%}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.blk{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.blk:first-of-type{border-top:0}
.blk.off{opacity:.4}
.min{min-width:46px;font-weight:700;color:var(--ac)}
.blk b{display:block}
.blk span{color:var(--mut);font-size:15px}
.fmt{background:var(--acbg);border-radius:10px;padding:8px 10px;margin-top:8px;color:var(--tx)!important}
.feel button{flex:1;padding:10px 0}
input{font:inherit;width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:10px 0}
.log{font-size:15px;padding:7px 0;border-top:1px solid var(--bd);display:flex;justify-content:space-between;gap:10px}
.log:first-of-type{border-top:0}
.log small{color:var(--mut)}
.link{background:none;border:0;color:var(--mut);padding:8px 0;min-height:0;text-decoration:underline;font-size:14px}
</style>
</head>
<body>
<main>
<h1>Heute</h1>
<p class="date" id="date"></p>
<div class="card"><h2>Diese Woche</h2><div class="dots" id="dots"></div><p class="sub" id="wk" style="margin-top:8px"></p></div>
<div class="card">
<h2>Dran ist</h2>
<p class="big" id="next"></p><p class="sub" id="nextsub"></p>
<div class="row" id="types" style="margin-top:10px"></div>
</div>
<div class="card"><h2>Wie viel Zeit?</h2><div class="seg" id="sizes"></div></div>
<div class="card"><h2>Ablauf</h2><div id="plan"></div></div>
<div class="card">
<h2>Abschluss und Logbuch</h2>
<div class="row feel" id="feel"></div>
<input id="note" type="text" placeholder="Skill-Stand, Spiel-Ergebnis (optional)" maxlength="140">
<button class="pri" id="done">Einheit abhaken</button>
</div>
<div class="card"><h2>Bonus (zählt nicht fürs Wochenziel)</h2>
<div class="row" id="bonus"></div></div>
<div class="card"><h2>Verlauf</h2><div id="hist"></div><button class="link" id="undo">Letzten Eintrag löschen</button></div>
</main>
<script>
(function(){
var KEY="nordstern-v1";
var TYPES={uk:"Unterkörper-Skill",ok:"Oberkörper-Skill",gk:"Ganzkörper-Spiel"};
var ORDER=["uk","ok","gk"];
var BONUS={flow:"Flow und Mobilität",trail:"Trail draußen",out:"Draußen und frei"};
var DATA={
uk:{ritual:"90/90 Hip Switches 1 × 8, Hüft- und Knie-CARs je 3 langsame Rotationen, tiefe Hocke 45 Sek.",
skill:"Pistol Squat mit Gegengewicht (zuletzt 5,5 kg): 3 Sek. absenken, 5 Sek. unten halten, 3–5 Wdh. pro Bein. Zum Schluss 1 Satz Sissy Squats mit Hilfe.",
end:"Hüftbeuger-Stretch 60 Sek. pro Seite, 90/90-Lagerung 2 Min."},
ok:{ritual:"Katze-Kuh und Schulter-CARs 5–8, Band Pull-Aparts 1 × 15, Scapular Pull-ups 1 × 6–8.",
skill:"Pike Push-ups (Füße am Boden) 3–5 Wdh. pro Runde, Wand-Handstand 3 × 15–20 Sek., negative Handstand-Liegestütze 3 × 2 mit 3 Sek. Absenken. Mit Zeit: Klimmzüge 2 × 3–4 oder Tuck Front Lever Hold 3 × 8–10 Sek.",
end:"Thread the Needle und Chin Tucks."},
gk:{ritual:"Ober- oder Unterkörper-Ritual, je nachdem, was sich besser anfühlt.",
skill:"Pistol oder Handstand, nach Lust.",
end:"Stretch nach Gefühl."}
};
var F=[
["EMOM","10 Min., drei Stationen im Kreis, Minute 10 frei",
{ok:"Min. 1: 4 Klimmzüge. Min. 2: 5 Dips mit gelbem Band. Min. 3: 8 Pallof Press pro Seite.",
uk:"Min. 1: 5 Bulgarian Split Squats pro Bein. Min. 2: 6 Reverse Nordic Curls. Min. 3: 8 Pallof Press pro Seite.",
gk:"Min. 1: 4 Klimmzüge. Min. 2: 5 Bulgarian Split Squats pro Bein. Min. 3: 6 Body Saw."}],
["AMRAP","Runden zählen",
{ok:"3 Klimmzüge, 5 Dips mit gelbem Band, 6 Ring-Rudern, Long Lever Plank 20 Sek.",
uk:"5 Bulgarian Split Squats pro Bein, 6 Reverse Nordic Curls, 10 einbeinige Wadenheben, 8 Pallof Press pro Seite.",
gk:"3 Klimmzüge, 5 Bulgarian Split Squats pro Bein, 5 Pike Push-ups, 6 Ring-Fallouts."}],
["Flow","Kette ohne Pause, dann von vorn",
{ok:"6 Ring-Rudern, Dip-Position 5 Sek., 5 Ring-Liegestütze, Tuck Front Lever Hold 8 Sek., Dead Hang 15 Sek.",
uk:"Tiefe Hocke 10 Sek., 4 Skater Squats pro Bein, 8 Single-Leg RDLs pro Bein mit Band, kleiner Sprung, Seitstütz 15 Sek. pro Seite.",
gk:"6 Ring-Rudern, Dip-Position 5 Sek., tiefe Hocke 10 Sek., kleiner Sprung, Dead Hang 15 Sek., Seitstütz 15 Sek. pro Seite."}],
["Schlingen-und-Ringe-Tabata","20 Sek. Arbeit, 10 Sek. Pause, 2 Durchgänge à 8 Runden",
{ok:"Durchgang 1: Ring-Rudern und Ring-Liegestütze. Durchgang 2: Pike Push-ups und Body Saw.",
uk:"Durchgang 1: Ring Hamstring Curls und Skater Squats. Durchgang 2: einbeinige Wadenheben und Pallof Hold.",
gk:"Durchgang 1: Ring-Rudern und Ring Hamstring Curls. Durchgang 2: Pike Push-ups und Body Saw."}],
["Rückenfreundlicher Core-Flow","Runden zählen",
{ok:"6 Ring-Fallouts, Tuck Front Lever Hold 8 Sek., 8 Pallof Press pro Seite, Seitstütz 20 Sek. pro Seite.",
uk:"8 Dead Bugs pro Seite, 6 Long Lever Bridge, 8 Pallof Press pro Seite, Seitstütz 20 Sek. pro Seite.",
gk:"6 Body Saw, 8 Band-Chops pro Seite, Long Lever Plank 25 Sek., 6 Long Lever Bridge."}],
["Sprossenwand-Parcours","Kurze Pause zwischen den Durchgängen, beste Zeit notieren",
{ok:"Seitlich hängend traversieren, 3 Klimmzüge, Dip-Position 5 Sek., Dead Hang 15 Sek.",
uk:"Sprossenwand hochsteigen, abspringen, tiefe Hocke 10 Sek., 4 Skater Squats pro Bein, Seitstütz 15 Sek. pro Seite.",
gk:"Seitlich traversieren, hochziehen, abspringen, tiefe Hocke 10 Sek., Seitstütz 15 Sek. pro Seite."}]
];
var st={log:[]};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&Array.isArray(p.log))st=p;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
function dk(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x;}
function weekStart(){var d=new Date();var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return dk(d);}
function core(){return st.log.filter(function(e){return ORDER.indexOf(e.t)>-1;});}
function nextType(){var c=core();if(!c.length)return "uk";var i=ORDER.indexOf(c[c.length-1].t);return ORDER[(i+1)%3];}
var cur=nextType(),size=30,feel=0,fmt=null,rolls=0;
function $(i){return document.getElementById(i);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function btn(label,cls,fn){var b=document.createElement("button");b.textContent=label;if(cls)b.className=cls;b.onclick=fn;return b;}
function draw(){
$("date").textContent=new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
var ws=weekStart();var n=core().filter(function(e){return e.d>=ws;}).length;
var dots=$("dots");dots.innerHTML="";
for(var i=0;i<Math.max(3,n);i++){var s=document.createElement("div");s.className="dot"+(i<n?" on":"");dots.appendChild(s);}
$("wk").textContent=n>=3?"Wochenziel erreicht ("+n+" Kerneinheiten). Alles weitere ist Bonus.":n+" von 3 Kerneinheiten";
$("next").textContent=TYPES[cur];
$("nextsub").textContent=cur===nextType()?"Nächste in der Rotation":"Von dir gewählt";
var t=$("types");t.innerHTML="";
ORDER.forEach(function(k){t.appendChild(btn(TYPES[k],k===cur?"sel":"",function(){cur=k;fmt=null;rolls=0;draw();}));});
var sz=$("sizes");sz.innerHTML="";
[10,15,20,30].forEach(function(m){sz.appendChild(btn(m+" Min.",m===size?"sel":"",function(){size=m;draw();}));});
plan();
var fe=$("feel");fe.innerHTML="";
for(var f=1;f<=5;f++)(function(f){fe.appendChild(btn(String(f),f===feel?"sel":"",function(){feel=f;draw();}));})(f);
bonus();hist();
}
function blk(min,title,text,off,extra){
return '<div class="blk'+(off?' off':'')+'"><div class="min">'+min+'</div><div><b>'+title+'</b><span>'+text+'</span>'+(extra||"")+'</div></div>';}
function plan(){
var d=DATA[cur],h="";
h+=blk("5 Min.","Ritual",esc(d.ritual));
h+=blk(size===10?"5 Min.":"10 Min.","Skill",esc(d.skill)+(size===10?" (nur 5 Min.: ein Fokus)":""));
var sp=size>=20,half=size===20;
var extra="";
if(sp){
extra='<div class="fmt">'+(fmt!==null?"<b>Format "+(fmt+1)+": "+esc(F[fmt][0])+"</b><br>"+esc(F[fmt][2][cur])+"<br><small>"+esc(F[fmt][1])+(half?" · nur die ersten 5 Min.":"")+"</small>":"Noch kein Format gewürfelt.")+'</div><div class="row" style="margin-top:8px"><button id="roll">'+(fmt===null?"Würfeln":"Neu würfeln")+'</button></div>';
}
h+=blk(sp?(half?"5 Min.":"10 Min."):"–","Spiel",sp?"Format per Würfel, Runden oder Zeit als Rekord.":"entfällt in dieser Größe",!sp,extra);
h+=blk(size===30?"5 Min.":"–","Abschluss",size===30?esc(d.end):"kurz auslaufen lassen, dann Logbuch (1 Min.)",size!==30);
$("plan").innerHTML=h;
var r=$("roll");if(r)r.onclick=function(){var x;do{x=Math.floor(Math.random()*6);}while(x===fmt);fmt=x;rolls++;plan();};
}
function bonus(){var b=$("bonus");b.innerHTML="";
Object.keys(BONUS).forEach(function(k){b.appendChild(btn(BONUS[k]+" ✓","",function(){add(k);}));});}
function add(t){
st.log.push({d:dk(new Date()),t:t,s:t===cur?size:0,g:feel,n:$("note").value.slice(0,140)});
if(st.log.length>200)st.log=st.log.slice(-200);
save();feel=0;fmt=null;rolls=0;$("note").value="";cur=nextType();draw();
window.scrollTo({top:0,behavior:"smooth"});
}
function hist(){var h=$("hist");h.innerHTML="";
var l=st.log.slice(-8).reverse();
if(!l.length){h.innerHTML='<p class="sub">Noch keine Einträge.</p>';return;}
l.forEach(function(e){
var dt=new Date(e.d+"T12:00:00").toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"numeric"});
var name=TYPES[e.t]||BONUS[e.t]||e.t;
var meta=(e.s?e.s+" Min.":"")+(e.g?(e.s?" · ":"")+"Gefühl "+e.g+"/5":"");
var div=document.createElement("div");div.className="log";
var a=document.createElement("div");
var b=document.createElement("b");b.textContent=name;a.appendChild(b);
if(e.n){a.appendChild(document.createElement("br"));var s=document.createElement("small");s.textContent=e.n;a.appendChild(s);}
var c=document.createElement("small");c.style.textAlign="right";c.textContent=dt+(meta?"\n"+meta:"");c.style.whiteSpace="pre-line";
div.appendChild(a);div.appendChild(c);h.appendChild(div);});
}
$("done").onclick=function(){add(cur);};
$("undo").onclick=function(){if(st.log.length){st.log.pop();save();cur=nextType();draw();}};
draw();
})();
</script>
</body>
</html>
